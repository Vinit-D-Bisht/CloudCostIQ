apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcost-backend-deployment
  namespace: cloudcost
  labels:
    app: cc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cc
  template:
    metadata:
      labels:
        app: cc
    spec:
      containers:
      - name: backend
        image: vinitbisht/cloudcostiq-backend:latest 
        imagePullPolicy: Always
        ports:
          - containerPort: 8001
        envFrom:
          - configMapRef:
              name: cloudcost-config
          - secretRef:
              name: cloudcost-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "300m"
          limits:
            memory: "256Mi"
            cpu: "600m"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
