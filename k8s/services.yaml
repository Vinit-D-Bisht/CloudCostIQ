apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: cloudcost
spec:
  type: ClusterIP
  selector:
    app: ccf
  ports:
    - name: http
      port: 3000
      targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: cloudcost
spec:
  type: ClusterIP
  selector:
    app: cc
  ports:
    - name: http
      port: 8001
      targetPort: 8001

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: cloudcost
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

