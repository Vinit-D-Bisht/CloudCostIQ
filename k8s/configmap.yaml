apiVersion: v1
kind: ConfigMap
metadata:
  name: cc-config
  namespace: cloudcost
data:
  MONGO_URL: "mongodb://USERNAME:PASSWORD@mongodb-service:27017/cloudcostiq?authSource=admin"
  DB_NAME: "cloudcostiq"
  CORS_ORIGINS: "http://localhost:3000"
  FRONTEND_URL: "http://localhost:3000"
  COOKIE_SECURE: "false"
  GEMINI_MODEL: "gemini-2.5-flash"
  GROQ_MODEL: "openai/gpt-oss-20b"
  GOOGLE_REDIRECT_URI: "http://localhost:8001/api/auth/google/callback"
