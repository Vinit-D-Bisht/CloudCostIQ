apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcost-frontend-deployment
  namespace: cloudcost
  labels:
    app: cc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cc
  template:
    metadata:
      labels:
        app: cc
    spec:
       initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z backend-svc 8001; do echo waiting for backend; sleep 2; done;']
      containers:
      - name: frontend
        image: vinitbisht/cloudcostiq-frontend:latest 
        imagePullPolicy: Always
        ports:
          - containerPort: 3000
        envFrom:
          - configMapRef:
              name: cloudcost-config
          - secretRef:
              name: cloudcost-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "300m"
          limits:
            memory: "256Mi"
            cpu: "600m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
