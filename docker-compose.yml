services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - cloudcost_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Always use the compose Mongo service (overrides local .env host).
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-cloudcostiq}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      ENABLE_FREE_AI: ${ENABLE_FREE_AI:-true}
      FREE_AI_BASE_URL: ${FREE_AI_BASE_URL:-https://openrouter.ai/api/v1}
      FREE_AI_MODEL: ${FREE_AI_MODEL:-openrouter/free}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - api

volumes:
  cloudcost_mongo:
